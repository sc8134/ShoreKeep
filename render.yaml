# Render blueprint: one web service that runs the API and the worker in the
# same container, with Postgres and a persistent disk for local media storage.
#
# Deploy: push this repo to GitHub, then Render Dashboard > New > Blueprint.
# Set SECRET_KEY and PUBLIC_BASE_URL when prompted. To run a full product
# instead of the public demo, set DEMO_MODE=false.
services:
  - type: web
    name: shorekeep
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: .
    dockerfilePath: ./infra/Dockerfile.backend
    dockerCommand: bash /app/start.sh
    healthCheckPath: /v1/health
    preDeployCommand: alembic -c /app/alembic.ini upgrade head
    disk:
      name: shorekeep-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shorekeep-db
          property: connectionString
      - key: DATA_DIR
        value: /data
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: shorekeep-db
    databaseName: shorekeep
    user: shorekeep
    plan: basic-256mb
