services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - ../.env
    volumes:
      - media_data:/data

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    command: python -m backend.engine.worker
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    volumes:
      - media_data:/data

volumes:
  media_data:
