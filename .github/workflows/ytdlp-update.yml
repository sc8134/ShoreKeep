name: Weekly yt-dlp update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare PyPI release with the pinned floor
        id: versions
        run: |
          latest=$(python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("https://pypi.org/pypi/yt-dlp/json", timeout=30) as response:
              print(json.load(response)["info"]["version"])
          PY
          )
          current=$(grep -oE 'yt-dlp>=[0-9][0-9.]*' services/backend/pyproject.toml | head -1 | sed 's/^yt-dlp>=//')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise the floor in both packages
        if: steps.versions.outputs.changed == 'true'
        run: |
          sed -i -E "s/yt-dlp>=[0-9][0-9.]*/yt-dlp>=${{ steps.versions.outputs.latest }}/" \
            services/backend/pyproject.toml services/desktop/pyproject.toml
          git diff --stat

      - name: Test against the new release
        if: steps.versions.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/backend[dev]" -e "services/desktop" "yt-dlp==${{ steps.versions.outputs.latest }}"
          python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
          python -m pytest services/backend/tests -q

      - name: Open a pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/yt-dlp-${{ steps.versions.outputs.latest }}
          delete-branch: true
          add-paths: |
            services/backend/pyproject.toml
            services/desktop/pyproject.toml
          title: "Bump yt-dlp to ${{ steps.versions.outputs.latest }}"
          commit-message: "Bump yt-dlp to ${{ steps.versions.outputs.latest }}"
          body: |
            Weekly check found a newer yt-dlp release.

            - previous floor: `${{ steps.versions.outputs.current }}`
            - new floor: `${{ steps.versions.outputs.latest }}`

            The test suite in this workflow ran against the new release.
